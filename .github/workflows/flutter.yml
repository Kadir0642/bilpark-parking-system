name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Sürüm sabit: yeni stable sürümler yeni lint uyarıları getirip CI'ı kod değişmeden kırabiliyor.
          # Geliştirme makinesindeki sürümle aynı tutulur; yükseltme ayrı bir PR ile yapılır (son: 3.50.1, material_ui geçişiyle).
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze

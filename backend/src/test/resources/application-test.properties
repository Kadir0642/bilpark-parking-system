spring.datasource.url=jdbc:h2:mem:bilpark_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-jwt-secret-key-at-least-32-bytes-long-0123456789
bilpark.seed.admin-password=test-admin-pass
bilpark.seed.officer-password=test-officer-pass
bilpark.seed.developer-password=test-developer-pass1

# H2 unit/MockMvc tests use Hibernate's schema; migrations are tested on PostgreSQL (Testcontainers)
spring.flyway.enabled=false

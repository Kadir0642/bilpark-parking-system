spring.application.name=bilpark-backend

# Database (loaded from environment variables - never hardcode credentials)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool sized for Neon free tier: no idle connections are kept, so the database can
# scale to zero between requests (an idle pooled connection keeps the Neon compute awake).
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Open-in-view is registered by OpenEntityManagerInViewConfig (everything except the SSE stream)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security (loaded from environment variables - app refuses to start without JWT_SECRET)
jwt.secret=${JWT_SECRET}

# Initial seed passwords (only needed when the users table is empty)
bilpark.seed.admin-password=${ADMIN_PASSWORD:}
bilpark.seed.officer-password=${OFFICER_PASSWORD:}
# Developer (maintenance) account, created once when DEVELOPER_PASSWORD is set (stage 5, see docs/sozlesme-eki-gelistirici-ve-lisans.md)
bilpark.seed.developer-username=${DEVELOPER_USERNAME:gelistirici}
bilpark.seed.developer-password=${DEVELOPER_PASSWORD:}

# Server
server.port=8080
server.address=0.0.0.0

# Flyway: the live schema was created by Hibernate before Flyway existed.
# baseline-on-migrate marks it as V1 (V1 is only run on an empty database),
# then V2+ apply. ddl-auto=update stays as a safety net for additive changes.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

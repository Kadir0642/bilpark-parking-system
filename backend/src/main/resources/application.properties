spring.application.name=bilpark-backend

# Database (loaded from environment variables - never hardcode credentials)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security (loaded from environment variables - app refuses to start without JWT_SECRET)
jwt.secret=${JWT_SECRET}

# Initial seed passwords (only needed when the users table is empty)
bilpark.seed.admin-password=${ADMIN_PASSWORD:}
bilpark.seed.officer-password=${OFFICER_PASSWORD:}

# Server
server.port=8080
server.address=0.0.0.0

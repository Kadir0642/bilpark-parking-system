spring.application.name=bilpark-backend

# Database (loaded from environment variables - never hardcode credentials)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool for Neon free tier: no idle connections are kept, so the database can scale to zero between
# requests (an idle pooled connection keeps the Neon compute awake). Neon 0.25 CU allows ~100 direct
# connections; 10 leaves headroom for migrations, the console and a second deploy. Env: DB_POOL_SIZE.
# connection-timeout fails fast: a request that cannot get a connection in 5 s answers 503 + Retry-After
# (GlobalExceptionHandler / JwtAuthFilter) instead of queueing for 20 s. It also covers a Neon wake-up; the
# connection being opened is kept for the next request. Env: DB_CONNECTION_TIMEOUT_MS.
# Leak detection is off unless DB_LEAK_DETECTION_MS is set (e.g. 10000 while debugging).
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# No open-in-view: a connection is held only inside a transaction, not while JSON / xlsx is written (load test:
# with OSIV the 5-connection pool filled up at 30 officers). Lazy data the response needs is fetched in the query.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security (loaded from environment variables - app refuses to start without JWT_SECRET)
jwt.secret=${JWT_SECRET}

# Initial seed passwords (only needed when the users table is empty)
bilpark.seed.admin-password=${ADMIN_PASSWORD:}
bilpark.seed.officer-password=${OFFICER_PASSWORD:}
# Developer (maintenance) account, created once when DEVELOPER_PASSWORD is set (stage 5, see docs/sozlesme-eki-gelistirici-ve-lisans.md)
bilpark.seed.developer-username=${DEVELOPER_USERNAME:gelistirici}
bilpark.seed.developer-password=${DEVELOPER_PASSWORD:}

# Server
server.port=8080
server.address=0.0.0.0
# Request threads (Tomcat default 200). Measured at 30 officers (NMT): thread stacks used ~2 MB in total, so a lower
# cap saves no memory, and with 50 the SSE delivery looked slower. SSE streams are async and hold no thread.
# Env: TOMCAT_MAX_THREADS.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}

# Flyway: the live schema was created by Hibernate (March 2026 app) before Flyway existed and has
# only active_park_spots and parking_records. baseline-on-migrate marks such a database as V0, so the
# idempotent V1 (CREATE TABLE IF NOT EXISTS) creates the missing tables, V2-V6 apply and V7 adds the
# missing columns. An empty database runs V1+ without a baseline. ddl-auto=update stays as a safety net.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Client IP (audit rows, rate limits): taken from X-Forwarded-For counting from the RIGHT. 1 = the entry the
# hosting proxy appends (the left part is client-controlled). Raise to 2 if one more proxy sits in front;
# 0 ignores the header. Env: CLIENT_IP_TRUSTED_PROXY_HOPS.
bilpark.client-ip.trusted-proxy-hops=${CLIENT_IP_TRUSTED_PROXY_HOPS:1}

# Plate lookup rate limit (GET /api/parking/debt, developer plate search): per client IP, fixed window, in memory.
# Many phones share one carrier IP, so per-ip (all lookups) is generous. Strict is the number of DIFFERENT
# plates of at most short-max-length characters (after removing spaces/dashes) per IP and for all clients
# together; repeating the same plate never counts there. Over a limit: 429 RATE_LIMITED + Retry-After.
# Officer / admin endpoints (check-in/out, panel, SSE) are not limited.
bilpark.rate-limit.plate-lookup.enabled=true
bilpark.rate-limit.plate-lookup.window-seconds=60
bilpark.rate-limit.plate-lookup.per-ip=120
bilpark.rate-limit.plate-lookup.short-distinct-per-ip=10
bilpark.rate-limit.plate-lookup.short-max-length=5
bilpark.rate-limit.plate-lookup.short-distinct-global=100
# At most this many client IPs are tracked; when full, new clients share one overflow bucket.
bilpark.rate-limit.plate-lookup.max-tracked-clients=10000

# Login brute-force protection (POST /api/auth/login), in memory. Per username (unknown ones too): after
# max-failures failed attempts in a row (gaps shorter than failure-window-seconds) the username is locked for the
# next length in lock-seconds (the last one repeats); a successful login or a password reset clears it.
# Per client IP: at most per-ip attempts per ip-window-seconds; a successful login gives its slot back, so
# officers behind one carrier IP are not held back. Over a limit: 429 RATE_LIMITED + Retry-After.
# Env overrides: BILPARK_RATE_LIMIT_LOGIN_PER_IP etc.
bilpark.rate-limit.login.enabled=true
bilpark.rate-limit.login.max-failures=5
bilpark.rate-limit.login.failure-window-seconds=900
bilpark.rate-limit.login.lock-seconds=60,300,900
bilpark.rate-limit.login.per-ip=30
bilpark.rate-limit.login.ip-window-seconds=60
bilpark.rate-limit.login.max-tracked-usernames=10000
bilpark.rate-limit.login.max-tracked-ips=10000

# Auth user cache (JwtAuthFilter): the user behind a valid token is cached briefly so each request does not read
# the users table again. Any change to a users row evicts it at once (UserCacheEvictionListener). 0 = off.
bilpark.auth.user-cache.ttl-seconds=30
bilpark.auth.user-cache.max-entries=1000

# Reports (/api/admin/reports/**): one at a time (heap on a 512 MB host); a second one waits up to wait-ms,
# then gets 503 REPORT_BUSY + Retry-After.
bilpark.reports.max-concurrent=1
bilpark.reports.wait-ms=5000
bilpark.reports.retry-after-seconds=10
